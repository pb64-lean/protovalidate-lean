syntax = "proto3";
package catalog.v1;
import "buf/validate/validate.proto";

enum Tier {
  TIER_UNSPECIFIED = 0;
  BASIC = 1;
  PREMIUM = 2;
  LEGACY = 3;
}

message Dimensions {
  int64 weight_grams = 1;
}

message Product {
  Dimensions dims = 15;
  string sku = 1 [(buf.validate.field).string = {
    min_len: 3, max_len: 32, pattern: "^[a-z][a-z0-9-]*$"
  }];
  string contact = 2 [(buf.validate.field).string.email = true,
                      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  optional string homepage = 3 [(buf.validate.field).string.uri = true];
  string region = 4 [(buf.validate.field).string = { in: ["us", "eu", "ap"] }];
  int32 stock = 5 [(buf.validate.field).int32 = { gte: 0, lt: 1000000 }];
  int64 price_cents = 6 [(buf.validate.field).int64.gt = 0,
                         (buf.validate.field).required = true];
  uint32 batch = 7 [(buf.validate.field).uint32 = { in: [1, 2, 3] }];
  double rating = 8 [(buf.validate.field).double = { gte: 0.0, lte: 5.0, finite: true }];
  bool published = 9 [(buf.validate.field).bool.const = true,
                      (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];
  bytes checksum = 10 [(buf.validate.field).bytes = { len: 4, prefix: "\x89P" }];
  Tier tier = 11 [(buf.validate.field).enum = { defined_only: true, not_in: [3] },
                  (buf.validate.field).cel = {
                    // custom CEL on an enum field: CEL compares enums as ints
                    id: "tier.assigned", message: "tier must be assigned",
                    expression: "this >= 1"
                  }];
  repeated string tags = 12 [(buf.validate.field).repeated = {
    min_items: 1, max_items: 8, unique: true,
    items: { string: { min_len: 2, max_len: 16 } }
  }];
  map<string, string> attrs = 13 [(buf.validate.field).map = {
    max_pairs: 4,
    keys: { string: { pattern: "^[a-z_]+$" } },
    values: { string: { min_len: 1 } }
  }];
  optional string owner = 14 [(buf.validate.field).required = true,
                              (buf.validate.field).string.min_len = 2];
}

message Payment {
  oneof method {
    option (buf.validate.oneof).required = true;
    string iban = 1 [(buf.validate.field).string = { min_len: 15, max_len: 34 }];
    Product store_credit_product = 2;
    string cash_note = 3;
  }
  oneof receipt {
    string email_to = 4;
    string sms_to = 5;
  }
  option (buf.validate.message).cel = {
    id: "payment.iban_country",
    expression: "this.iban == '' || this.iban.startsWith('DE')"
  };
  option (buf.validate.message).cel = {
    id: "payment.receipt_email",
    expression: "has(this.email_to) ? this.email_to.isEmail() : true"
  };
}
